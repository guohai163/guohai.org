---
layout: default
---
<article class="reading-page">
  <header class="reading-header">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
