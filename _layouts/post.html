---
layout: default
---
<article class="reading-page">
  <header class="reading-header">
    <p class="kicker"><a href="{{ '/blog/' | relative_url }}">文章</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  {% if page.tags.size > 0 %}
  <p class="tag-links">
    {% for tag in page.tags %}
      <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a>
    {% endfor %}
  </p>
  {% endif %}
  {% if site.disqus.categories contains page.category %}
    {% include disqus.html %}
  {% endif %}
</article>
