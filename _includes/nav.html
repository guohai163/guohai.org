<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="H!Guo 技术笔记首页">
      <span class="brand-mark" aria-hidden="true">H!</span>
      <span class="brand-name">H!Guo <span>技术笔记</span></span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.url == '/iot-server/' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>项目</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
    </nav>
  </div>
</header>
